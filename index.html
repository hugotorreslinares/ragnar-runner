<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>Escape from Bogotá — Endless Runner Game</title>
    <meta
      name="description"
      content="Escape from Bogotá: a fast, free browser runner. Dodge bollards and potholes, catch stars, and climb the global leaderboard. No install, play instantly."
    />
    <meta name="author" content="Hugo Torres" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://escape-bogota.vercel.app/" />

    <!-- Open Graph / Facebook, WhatsApp, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://escape-bogota.vercel.app/" />
    <meta property="og:title" content="Escape from Bogotá — Endless Runner Game" />
    <meta
      property="og:description"
      content="Dodge bollards and potholes, catch stars, and climb the global leaderboard. Free, instant, no install."
    />
    <meta property="og:image" content="https://escape-bogota.vercel.app/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CO" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Escape from Bogotá — Endless Runner Game" />
    <meta
      name="twitter:description"
      content="Dodge bollards and potholes, catch stars, and climb the global leaderboard."
    />
    <meta name="twitter:image" content="https://escape-bogota.vercel.app/images/og-image.jpg" />

    <meta name="theme-color" content="#e8ab3a" />

    <!-- Favicons -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Stamps data-theme on <html> from the current month. Loaded here, next
         to the stylesheet, so the seasonal palette is in place before the
         first paint instead of flashing the default one. -->
    <script type="module" src="js/theme.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Escape from Bogotá",
        "url": "https://escape-bogota.vercel.app/",
        "image": "https://escape-bogota.vercel.app/images/og-image.jpg",
        "description": "A fast, free browser runner. Dodge bollards and potholes, catch stars, and climb the global leaderboard.",
        "genre": "Endless Runner",
        "gamePlatform": "Web Browser",
        "applicationCategory": "Game",
        "author": { "@type": "Person", "name": "Hugo Torres" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="wrap">
      <div id="plate">
        <div style="display: flex; align-items: center; gap: 10px">
          <div class="rivet"></div>
          <div id="titleblock">
            <div class="eyebrow" data-text="header.eyebrow"></div>
            <h1><span data-text="header.titleLead"></span> <span data-text="header.titleAccent"></span></h1>
          </div>
        </div>
        <div id="hud" >
          <div class="hudstat">
            <label data-text="hud.distance"></label>
            <div class="val" id="scoreVal">0</div>
          </div>
          <div class="hudstat">
            <label data-text="hud.best"></label>
            <div class="val" id="bestVal">0</div>
          </div>
          <div class="hudstat">
            <label data-text="hud.lives"></label>
            <div id="lives"></div>
          </div>
          <div class="hudstat">
            <label data-text="hud.stars"></label>
            <div class="val" id="starsVal">0/10</div>
          </div>
          <div class="hudstat">
            <label data-text="hud.speed"></label>
            <div class="val" id="speedVal">0.0</div>
          </div>
        </div>
      </div>

      <div id="stage">
        <div
          id="errBanner"
          class="hidden"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            background: #c4453a;
            color: #fff;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            padding: 6px 10px;
            z-index: 50;
            word-break: break-word;
          "
        ></div>
        <!-- Classic (non-module) script, registered as early as possible so it
         can surface errors even if a module below fails to load/parse. -->
        <script>
          window.addEventListener("error", function (e) {
            try {
              const b = document.getElementById("errBanner");
              if (b) {
                b.textContent = "Script error: " + (e.message || e);
                b.classList.remove("hidden");
              }
            } catch (_) {}
          });
        </script>
        <canvas id="game" width="900" height="580"></canvas>
        <div id="stageHud">
          <div class="grp">
            <div id="livesMini"></div>
          </div>
          <div class="grp">
            <span id="starsMini">★ 0/10</span>
          </div>
          <div class="grp">
            <span id="speedMini">⚡ 0.0</span>
          </div>
        </div>

        <div class="overlay" id="startOverlay">
          <h2><span data-text="start.titleLead"></span> <span data-text="start.titleAccent"></span></h2>
          <!-- Filled by js/theme.js; stays hidden in months with no theme. -->
          <div class="season-badge hidden" id="seasonBadge"></div>
          <p data-text="start.intro"></p>
          <div class="initial-image" style="border-radius: 10px"></div>

         
          
          <div class="keys">
            <div class="key"><b>←</b> <span data-text="start.keyLeft"></span></div>
            <div class="key"><b>→</b> <span data-text="start.keyRight"></span></div>
            <div class="key"><b>↑ / SPACE</b> <span data-text="start.keyJump"></span></div>
            <div class="key"><b>ESC</b> <span data-text="start.keyPause"></span></div>
          </div>
          <button class="cta" id="startBtn" data-text="start.startButton"></button>
          <!-- Hidden until Chromium says the game is installable (see
               js/install.js). Safari never fires that event, so there the
               button never appears. -->
          <button class="cta small hidden" id="installBtn" data-text="start.installButton"></button>
          <div class="lb" id="lbStart">
            <div class="lb-title" data-text="leaderboard.titleStart"></div>
            <div class="lb-list" id="lbStartList">
              <div class="lb-status">Loading…</div>
            </div>
          </div>
        </div>

        <div class="overlay hidden" id="overOverlay">
          <div style="display: grid; grid-template-columns: 30% 60%">
            <div class="ragnar-failed-container">
              <img
                src="images/ragnar-defeated.webp"
                alt="Ragnar aiming"
                id="ragnarFailed"
                height="120px"
                style="border-radius: 10px"
              />
            </div>

            <div class="right-failed">
              <h2><span data-text="over.titleLead"></span> <span data-text="over.titleAccent"></span></h2>
              <p id="overText"></p>
              <div class="lb-submit" id="lbSubmit">
                <input
                  type="text"
                  id="lbNameInput"
                  maxlength="12"
                  data-text-placeholder="over.namePlaceholder"
                  autocomplete="off"
                  autocapitalize="characters"
                />
                <button class="cta small" id="lbSubmitBtn" data-text="leaderboard.submitButton"></button>
              </div>
              <button class="cta" id="restartBtn" data-text="over.restartButton"></button>
            </div>
          </div>
          <div class="lb" id="lbOver">
            <div class="lb-title" data-text="leaderboard.titleOver"></div>
            <div class="lb-list" id="lbOverList">
              <div class="lb-status">Loading…</div>
            </div>
          </div>
        </div>

        <div class="overlay hidden" id="pauseOverlay">
          <h2><span data-text="pause.titleLead"></span> <span data-text="pause.titleAccent"></span></h2>
          <p data-text="pause.body"></p>
          <button class="cta" id="resumeBtn" data-text="pause.resumeButton"></button>
        </div>

        <button id="pauseBtn" data-text-aria-label="controls.pauseLabel">❚❚</button>
        <button id="muteBtn" data-text-aria-label="controls.muteLabel" aria-pressed="false">
          ♪
        </button>
      </div>

      <div id="touch">
        <div class="side">
          <div class="tbtn" id="btnLeft">◀</div>
          <div class="tbtn" id="btnRight">▶</div>
        </div>
        <div class="tbtn jump" id="btnJump" data-text="controls.touchJump"></div>
      </div>

      <div id="footer-note" data-text="footer"></div>
    </div>

    <script type="module" src="js/main.js"></script>

    <!-- Vercel Web Analytics (page views). Inert anywhere but a Vercel
         deployment with Analytics enabled for the project: the script path
         is a route Vercel adds at deploy time, so locally it just 404s and
         the queue shim below swallows any call until then.
         The dashboard also exposes a project-specific path that ad blockers
         do not recognise; swapping it in here raises the count it sees. -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script>
      // The insights route only exists on a Vercel deployment, and its path
      // is absolute, so on GitHub Pages (where the game lives under
      // /ragnar-runner/) it is a guaranteed 404 in the console. Skip the
      // hosts we know cannot serve it and load it everywhere else — an
      // allowlist of vercel.app would silently switch analytics off the day
      // a custom domain is attached.
      (function () {
        var h = location.hostname;
        var noInsights =
          h.endsWith(".github.io") ||
          h === "localhost" ||
          h === "127.0.0.1" ||
          h === "";
        if (noInsights) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = "/_vercel/insights/script.js";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
